{% extends "base.html" %} {% block content %} {% if current_track %}
<h1>Плеер</h1>

<div id="player">
    <audio id="audio" controls>
            <source src="{{ url_for('play_track', track_id=current_track.id) }}" type="audio/mpeg">
        </audio>
    <p>Сейчас играет: <strong id="track-title">{{ current_track.title }}</strong> — <span id="track-artist">{{ current_track.artist }}</span></p>
</div>

<div>
    <button id="prev-btn" {% if not prev_track %}disabled{% endif %}>⏮ Предыдущий</button>
    <button id="next-btn" {% if not next_track %}disabled{% endif %}>Следующий ⏭</button>
</div>

<p><a href="{{ url_for('search_track') }}">← Назад к поиску</a></p>

<ul id="playlist" style="display: none;">
    {% for track in tracks %}
    <li data-id="{{ track.id }}" data-title="{{ track.title }}" data-artist="{{ track.artist }}"></li>
    {% endfor %}
</ul>

<script>
    const audio = document.getElementById('audio');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const playlistItems = document.querySelectorAll('#playlist li');

    if (playlistItems.length > 0) {
        let currentIndex = -1;
        const currentTrackId = "{{ current_track.id }}";
        playlistItems.forEach((item, index) => {
            if (item.dataset.id === currentTrackId) {
                currentIndex = index;
            }
        });

        function playTrack(index) {
            if (index >= 0 && index < playlistItems.length) {
                const track = playlistItems[index];
                audio.src = "/play/" + track.dataset.id;
                audio.play();
                trackTitle.textContent = track.dataset.title;
                trackArtist.textContent = track.dataset.artist;
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === playlistItems.length - 1);
                currentIndex = index;
            }
        }

        audio.addEventListener('ended', function() {
            if (currentIndex < playlistItems.length - 1) {
                playTrack(currentIndex + 1);
            }
        });

        prevBtn.addEventListener('click', function() {
            if (currentIndex > 0) {
                playTrack(currentIndex - 1);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentIndex < playlistItems.length - 1) {
                playTrack(currentIndex + 1);
            }
        });
    }
</script>
{% else %}
<p>Трек не выбран. <a href="{{ url_for('search_track') }}">Перейти к поиску</a></p>
{% endif %} {% endblock %}
