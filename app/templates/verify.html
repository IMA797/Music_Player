{% extends "base.html" %} {% block content %}
<h1>Verification</h1>
<form action="" method="post">
    {{ form.hidden_tag() }}
    <p>
        {{ form.code.label }}<br> {{ form.code(size=6) }}<br> {% for error in form.code.errors %}
        <span style="color: red">[{{ error }}]</span>{% endfor %}
    </p>
    <p>{{ form.submit() }}</p>
</form>{% endblock %}
